name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # または master に変更（自分のブランチ名に合わせて）

permissions:
  contents: write

# 連続pushでもデプロイ同士が競合しないよう、実行中の古いデプロイはキャンセルする
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
